spring.application.name=fdservice

# Group 2 hasn't shipped their Product & Pricing service yet, so
# ProductPricingClientStub stands in (see its javadoc). Flip this to false and
# set the base-url below once G2 has something running.
fd.clients.product-pricing.stub-mode=true

# Group 2 (Product & Pricing) service base URL, used by ProductPricingClient
# once fd.clients.product-pricing.stub-mode=false
fd.clients.product-pricing.base-url=http://localhost:8082/products/v1

# Frontend dev server origin(s) allowed to call this API cross-origin (CORS).
# Comma-separated if there's ever more than one.
fd.cors.allowed-origins=http://localhost:3000

# Branch code used to generate account numbers when the request itself carries no
# branch (CreateFdAccountRequest has no branch field per the OpenAPI spec). A
# FD_ACCOUNT_SEQUENCE row must exist for this branch code.
fd.account-number.default-branch-cd=001

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/fd_db
spring.datasource.username=root
spring.datasource.password=password

# Hibernate: auto-create/update tables from entities (dev only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true